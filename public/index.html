<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilorin Life</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1ea;
      color: #222;
    }

    header {
      background: #1d4d3a;
      color: white;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .money {
      font-size: 30px;
      font-weight: bold;
      color: #1d4d3a;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #1d4d3a;
      color: white;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>ILORIN LIFE</h1>
    <p>Your life. Your hustle. Your Ilorin.</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Welcome 👋</h2>
      <p>Your virtual life in Ilorin starts here.</p>
    </div>

    <div class="card">
      <h3>Your Wallet</h3>
      <div class="money">₦10,000</div>
    </div>

    <div class="card">
      <h3>What do you want to do?</h3>

      <button>Find a Job 💼</button>
      <button>Explore Ilorin 🏙️</button>
      <button>Visit Market 🛒</button>
      <button>Meet People 👥</button>
    </div>

  </div>

</body>
</html>
